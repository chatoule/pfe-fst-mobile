name: gestion_presences_fst
description: Application de gestion des présences et pointages - FST UIN
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  get: ^4.6.6


  http: ^1.2.1


  shared_preferences: ^2.2.3


  local_auth: ^2.3.0


  signature: ^5.5.0


  pdf: ^3.10.8
  printing: ^5.13.1


  excel: ^4.0.2


  share_plus: ^9.0.0
  path_provider: ^2.1.3

  file_picker: ^8.0.7


  image_picker: ^1.1.2


  fl_chart: ^0.68.0



  intl: ^0.19.0


  flutter_pdfview: ^1.4.4


  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/logo_uin.png