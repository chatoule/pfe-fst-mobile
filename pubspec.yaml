name: pointage
description: "Application de gestion des presences & pointage - FST UIN"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  get: ^4.6.6
  http: ^1.2.0
  shared_preferences: ^2.2.2
  signature: ^5.4.0
  local_auth: ^3.0.1
  pdf: ^3.10.8
  printing: ^5.12.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

  file_picker: ^10.1.9
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/logo_uin.png